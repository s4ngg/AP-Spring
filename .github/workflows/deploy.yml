name: Spring Boot Deploy

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 21 설정
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradle 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Gradle 빌드 (테스트 제외)
      - name: Build with Gradle
        run: ./gradlew clean build -x test
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_TIME: ${{ secrets.JWT_EXPIRATION_TIME }}

      # 5. AWS 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 6. S3에 jar 업로드
      - name: Upload jar to S3
        run: |
          JAR_FILE=$(ls build/libs/*.jar | grep -v plain)
          aws s3 cp $JAR_FILE s3://${{ secrets.BACKEND_S3_BUCKET_NAME }}/deploy/app.jar

      # 7. EC2에서 배포 (SSM)
      - name: Deploy to EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws s3 cp s3://${{ secrets.BACKEND_S3_BUCKET_NAME }}/deploy/app.jar /home/ec2-user/app.jar",
              "sudo fuser -k 8080/tcp || true",
              "nohup java -jar /home/ec2-user/app.jar --spring.datasource.url=jdbc:mysql://${{ secrets.DB_HOST }}:3306/allpick --spring.datasource.username=${{ secrets.DB_USERNAME }} --spring.datasource.password=${{ secrets.DB_PASSWORD }} --jwt.secret=${{ secrets.JWT_SECRET }} --jwt.expiration-time=${{ secrets.JWT_EXPIRATION_TIME }} --spring.data.redis.host=${{ secrets.REDIS_HOST }} > /home/ec2-user/app.log 2>&1 &"
            ]'