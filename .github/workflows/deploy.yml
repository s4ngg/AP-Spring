name: Spring Boot Deploy

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_TIME: ${{ secrets.JWT_EXPIRATION_TIME }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          S3_IMAGE_BUCKET_NAME: ${{ secrets.S3_IMAGE_BUCKET_NAME }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          COOLSMS_API_KEY: ${{ secrets.COOLSMS_API_KEY }}
          COOLSMS_API_SECRET: ${{ secrets.COOLSMS_API_SECRET }}
          COOLSMS_SENDER: ${{ secrets.COOLSMS_SENDER }}
          BUSINESS_API_KEY: ${{ secrets.BUSINESS_API_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload jar to S3
        run: |
          JAR_FILE=$(ls build/libs/*.jar | grep -v plain)
          aws s3 cp $JAR_FILE s3://${{ secrets.BACKEND_S3_BUCKET_NAME }}/deploy/app.jar

      - name: Deploy to EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws s3 cp s3://${{ secrets.BACKEND_S3_BUCKET_NAME }}/deploy/app.jar /home/ec2-user/app.jar",
              "sudo fuser -k 8080/tcp || true",
              "nohup java -jar /home/ec2-user/app.jar --spring.datasource.url=jdbc:mysql://${{ secrets.DB_HOST }}:3306/allpick --spring.datasource.username=${{ secrets.DB_USERNAME }} --spring.datasource.password=${{ secrets.DB_PASSWORD }} --jwt.secret=${{ secrets.JWT_SECRET }} --jwt.expiration-time=${{ secrets.JWT_EXPIRATION_TIME }} --spring.data.redis.host=${{ secrets.REDIS_HOST }} --spring.cloud.aws.credentials.access-key=${{ secrets.AWS_ACCESS_KEY }} --spring.cloud.aws.credentials.secret-key=${{ secrets.AWS_SECRET_KEY }} --cloud.aws.s3.image-bucket=${{ secrets.S3_IMAGE_BUCKET_NAME }} --coolsms.api-key=${{ secrets.COOLSMS_API_KEY }} --coolsms.api-secret=${{ secrets.COOLSMS_API_SECRET }} --coolsms.sender=${{ secrets.COOLSMS_SENDER }} --business.api.key=${{ secrets.BUSINESS_API_KEY }} > /tmp/app.log 2>&1 &"
            ]'