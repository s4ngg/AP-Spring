spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/allpick?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update 
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
 
# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-time=${JWT_EXPIRATION_TIME}

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=6379

# AWS S3
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.s3.image-bucket=${S3_IMAGE_BUCKET_NAME}

# CoolSMS
coolsms.api-key=${COOLSMS_API_KEY}
coolsms.api-secret=${COOLSMS_API_SECRET}
coolsms.sender=${COOLSMS_SENDER}

# 사업자 검증
business.api.key=${BUSINESS_API_KEY}

spring.cloud.aws.s3.region=ap-southeast-2
spring.autoconfigure.exclude=io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration
