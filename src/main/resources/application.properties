spring.datasource.url=jdbc:mysql://localhost:3306/allpick?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-time=${JWT_EXPIRATION_TIME}

# Redis
# spring.data.redis.host=[Redis EC2 퍼블릭 IP]
spring.data.redis.port=6379

# CoolSMS
coolsms.api-key=${COOLSMS_API_KEY}
coolsms.api-secret=${COOLSMS_API_SECRET}
coolsms.sender=01012345678

# 사업자 검증
business.api.key=${BUSINESS_API_KEY}